{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>Balení byla úspěšně přidána</h1><p>{{m.name}} – můžete ihned vytisknout QR štítky nových balení.</p>{% for p in packages %}<div class="package-preview"><span><strong>Balení</strong><small>Expirace {{pretty_exp(p.expiry)}}</small></span><a class="btn secondary" href="{{url_for('package_label',pid=p.id)}}" target="_blank" rel="noopener">QR štítek</a></div>{% endfor %}<div class="actions"><a class="btn" href="{{url_for('index',selected=m.id)}}">Dokončit a vrátit se do katalogu</a><a class="btn secondary" href="{{url_for('package_new',mid=m.id)}}">Přidat další balení</a></div></section>{% endblock %}
