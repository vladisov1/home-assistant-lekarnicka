<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Lékárnička{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><div class="wrap head"><a class="brand" href="{{url_for('index')}}">💊 Lékárnička</a><nav><a href="{{url_for('settings')}}">Nastavení</a>{% if password_enabled %}<form method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf" value="{{csrf_token()}}"><button class="link">Odhlásit</button></form>{% endif %}</nav></div></header><div class="app-layout"><aside class="sidebar"><a href="{{url_for('locations')}}">▣ Obal / úložná krabice</a><a href="{{url_for('index')}}">💊 Léky</a><a href="{{url_for('shopping_cart')}}">🛒 Nákupní košík ({{cart_count}})</a></aside><main class="wrap content">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{category}}">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main></div></body></html>
