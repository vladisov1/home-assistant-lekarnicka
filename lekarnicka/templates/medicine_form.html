{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>{{'Upravit lék' if m else 'Přidat nový lék'}}</h1><form method="post"><input type="hidden" name="csrf" value="{{csrf_token()}}"><input type="hidden" name="location_id" value="{{loc_id or ''}}"><label>Název léku *<input name="name" required autofocus value="{{m.name if m else ''}}"></label><label>EAN (nepovinné)<input name="ean" value="{{m.ean if m else ''}}"></label><label>Poznámky<textarea name="notes">{{m.notes if m else ''}}</textarea></label><div class="actions"><button>Uložit</button><a class="btn secondary" href="{{url_for('index',location_id=loc_id) if loc_id else url_for('index')}}">Zrušit</a></div></form></section>{% endblock %}
